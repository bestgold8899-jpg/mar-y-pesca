
name: Prueba Copernicus Marine

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  oleaje:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install copernicusmarine xarray netCDF4 pandas

      - name: Calcular fechas de descarga (9 días disponibles)
        id: fechas
        shell: bash
        run: |
          set -euo pipefail

          START=$(date -u '+%Y-%m-%dT00:00:00')
          END=$(date -u -d '+9 days' '+%Y-%m-%dT00:00:00')

          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

          echo "Inicio: $START UTC"
          echo "Final:  $END UTC"

      - name: Descargar, procesar, validar y enviar oleaje
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          MAR_PESCA_INGEST_TOKEN: ${{ secrets.MAR_PESCA_INGEST_TOKEN }}
          START_DATE: ${{ steps.fechas.outputs.start }}
          END_DATE: ${{ steps.fechas.outputs.end }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${COPERNICUSMARINE_SERVICE_USERNAME:-}" ]; then
            echo "ERROR: falta COPERNICUS_USERNAME"
            exit 1
          fi

          if [ -z "${COPERNICUSMARINE_SERVICE_PASSWORD:-}" ]; then
            echo "ERROR: falta COPERNICUS_PASSWORD"
            exit 1
          fi

          if [ -z "${MAR_PESCA_INGEST_TOKEN:-}" ]; then
            echo "ERROR: falta MAR_PESCA_INGEST_TOKEN"
            exit 1
          fi

          while IFS='|' read -r LOCATION LAT LON; do
            [ -z "$LOCATION" ] && continue

            echo ""
            echo "=========================================="
            echo "Procesando oleaje: $LOCATION"
            echo "=========================================="

            MIN_LON=$(awk -v x="$LON" 'BEGIN {printf "%.5f", x - 0.25}')
            MAX_LON=$(awk -v x="$LON" 'BEGIN {printf "%.5f", x + 0.25}')
            MIN_LAT=$(awk -v x="$LAT" 'BEGIN {printf "%.5f", x - 0.25}')
            MAX_LAT=$(awk -v x="$LAT" 'BEGIN {printf "%.5f", x + 0.25}')

            NETCDF="oleaje_${LOCATION}.nc"
            JSON="oleaje_${LOCATION}.json"

            rm -f "$NETCDF" "$JSON"

            # 1. Descargar datos originales de Copernicus.
            copernicusmarine subset \
              --dataset-id cmems_mod_glo_wav_anfc_0.083deg_PT3H-i \
              --variable VHM0 \
              --variable VMDR \
              --variable VTPK \
              --minimum-longitude "$MIN_LON" \
              --maximum-longitude "$MAX_LON" \
              --minimum-latitude "$MIN_LAT" \
              --maximum-latitude "$MAX_LAT" \
              --start-datetime "$START_DATE" \
              --end-datetime "$END_DATE" \
              --output-directory . \
              --output-filename "oleaje_${LOCATION}" \
              --file-format netcdf

            if [ ! -s "$NETCDF" ]; then
              echo "ERROR: NetCDF inexistente o vacío para $LOCATION"
              exit 1
            fi

            # 2. Convertir NetCDF a JSON.
            python scripts/procesar_oleaje.py \
              --input "$NETCDF" \
              --output "$JSON" \
              --location "$LOCATION" \
              --lat "$LAT" \
              --lon "$LON"

            if [ ! -s "$JSON" ]; then
              echo "ERROR: JSON inexistente o vacío para $LOCATION"
              exit 1
            fi

            # 3. Validar cantidad, fechas, continuidad y valores.
            python - "$JSON" "$START_DATE" "$END_DATE" <<'PY'
          import json
          import math
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          filename, start_text, end_text = sys.argv[1:4]

          path = Path(filename)

          def fail(message):
              raise SystemExit(f"ERROR DE VALIDACIÓN: {message}")

          def parse_date(value):
              try:
                  result = datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  )
                  if result.tzinfo is None:
                      result = result.replace(tzinfo=timezone.utc)
                  return result.astimezone(timezone.utc)
              except Exception:
                  fail(f"Fecha inválida: {value}")

          try:
              data = json.loads(path.read_text(encoding="utf-8"))
          except Exception as exc:
              fail(f"JSON ilegible: {exc}")

          records = data.get("datos")

          if not isinstance(records, list):
              fail("No existe una lista de datos válida")

          count = len(records)

          print(f"Registros encontrados: {count}")

          if count < 60:
              fail(f"Solo hay {count} registros; mínimo permitido: 60")

          start = parse_date(start_text)
          end = parse_date(end_text)

          timestamps = []

          for index, record in enumerate(records):
              if not isinstance(record, dict):
                  fail(f"Registro {index} inválido")

              timestamp = parse_date(
                  record.get("fecha_utc", "")
              )

              timestamps.append(timestamp)

              height = record.get("altura_olas_m")
              direction = record.get("direccion_olas_grados")
              period = record.get("periodo_olas_s")

              for name, value in (
                  ("altura", height),
                  ("dirección", direction),
                  ("período", period),
              ):
                  if isinstance(value, bool) or not isinstance(
                      value, (int, float)
                  ):
                      fail(f"{name} inválida en registro {index}")

                  if not math.isfinite(value):
                      fail(f"{name} no finita en registro {index}")

              if height < 0:
                  fail(f"Altura negativa en registro {index}")

              if not 0 <= direction < 360:
                  fail(f"Dirección fuera de rango en registro {index}")

              if period <= 0:
                  fail(f"Período no válido en registro {index}")

          if timestamps != sorted(timestamps):
              fail("Los registros no están ordenados cronológicamente")

          if len(set(timestamps)) != len(timestamps):
              fail("Hay fechas duplicadas")

          first = timestamps[0]
          last = timestamps[-1]

          print(f"Primer registro: {first.isoformat()}")
          print(f"Último registro: {last.isoformat()}")

          # La descarga debe cubrir aproximadamente los 9 días solicitados.
          if first < start - timedelta(hours=3):
              fail("Hay registros anteriores al período solicitado")

          if first > start + timedelta(hours=6):
              fail("La previsión comienza demasiado tarde")

          if last < end - timedelta(hours=6):
              fail("La previsión termina demasiado pronto")

          if last > end + timedelta(hours=3):
              fail("Hay registros posteriores al período solicitado")

          # Copernicus entrega estos datos cada 3 horas.
          for previous, current in zip(
              timestamps, timestamps[1:]
          ):
              difference = current - previous

              if difference <= timedelta(0):
                  fail("Intervalo cronológico inválido")

              if difference > timedelta(hours=6):
                  fail(
                      f"Hueco de más de 6 horas: "
                      f"{previous.isoformat()} -> "
                      f"{current.isoformat()}"
                  )

          print("VALIDACIÓN CORRECTA")
          print("Cobertura temporal, continuidad y valores correctos.")
          PY

            # 4. Enviar únicamente después de superar la validación.
            echo "Enviando datos al Worker: $LOCATION"

            curl --fail-with-body \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 180 \
              -X POST \
              -H "Authorization: Bearer ${MAR_PESCA_INGEST_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary "@${JSON}" \
              https://mar-pesca-api.bestgold8899.workers.dev/api/oleaje/ingest

            echo ""
            echo "Oleaje enviado correctamente: $LOCATION"

          done <<'LOCATIONS'
          mdiq|35.684|-5.326
          martil|35.617|-5.275
          fnideq|35.849|-5.357
          tanger|35.779|-5.813
          al-hoceima|35.249|-3.937
          nador|35.168|-2.928
          casablanca|33.599|-7.620
          agadir|30.427|-9.598
          dakhla|23.684|-15.958
          asilah|35.465|-6.034
          larache|35.193|-6.156
          mehdia|34.256|-6.672
          el-jadida|33.256|-8.508
          safi|32.299|-9.237
          essaouira|31.513|-9.77
          sidi-ifni|29.379|-10.173
          tan-tan-plage|28.493|-11.337
          tarfaya|27.937|-12.927
          laayoune-plage|27.1|-13.43
          LOCATIONS

      - name: Guardar resultados JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oleaje-diecinueve-localidades
          path: oleaje_*.json
          if-no-files-found: warn
